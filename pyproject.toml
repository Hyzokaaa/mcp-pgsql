[project]
name = "mcp-pgsql"
version = "0.1.0"
description = "Sistema de agente que permite la comunicación con bd en postgres utilizando LLM en ollama"
authors = [{name = "Hyzokaaa", email = "luismiguellagosxenes@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.11.5",
    "mcp>=1.9.1",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "streamlit>=1.45.1",
    "sqlalchemy>=2.0.41",
    "psycopg2>=2.9.10",
    "oracledb>=3.1.1",
    "nest-asyncio>=1.6.0",
    "langchain-core>=0.3.65",
    "langchain-ollama>=0.3.3",
    "sqlparse>=0.5.3",
    "pytest>=8.4.1"
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
direct = { cmd = "python -m app.direct_client" }
ui = { cmd = "python -m streamlit run app/ui.py" }

